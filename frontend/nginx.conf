server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксируем API и healthcheck на backend-контейнер (docker network).
    # /api — это REST + HLS-прокси (Jellyfin/TorrServer), без WebSocket. Раньше тут
    # безусловно слались upgrade-заголовки (Connection: upgrade) — на обычных keep-alive
    # запросах это переводило соединение в tunnel-режим и РЕЗАЛО большие тела ответа:
    # длинные HLS-плейлисты фильмов (~1.5МБ) обрывались на ~144КБ → в браузере
    # net::ERR_CONTENT_LENGTH_MISMATCH и зависший плеер (короткие плейлисты сериалов
    # укладывались и играли). Убрали upgrade, включили нормальный keep-alive к бэкенду
    # и отключили проксибуферизацию, чтобы видеопоток шёл без задержки/обрезки.
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /healthz {
        proxy_pass http://backend:3001;
    }
}
