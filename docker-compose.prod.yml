# Продакшн: тянем готовые образы из GHCR (собраны в GitHub Actions),
# на сервере ничего не собирается.
#
#   IMAGE_TAG=latest docker compose -f docker-compose.prod.yml pull
#   IMAGE_TAG=latest docker compose -f docker-compose.prod.yml up -d
#
# IMAGE_TAG можно зафиксировать на версии релиза (напр. v0.1.0) или sha-<коммит>.

services:
  backend:
    image: ghcr.io/braidner/braidnerassist-backend:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      DATABASE_URL: file:/data/mission-control.db
      MEDIA_ROOT: /media
      # qBittorrent-контейнер homelab-стека видит тот же MEDIA_HOST_PATH как /data.
      # Это значение уходит в qB WebAPI torrents/add savepath.
      QBITTORRENT_SAVE_ROOT: /data
      # Docker Engine API (opt-in включён): backend читает контейнеры через этот сокет.
      # ВНИМАНИЕ: docker.sock = root-эквивалент на хосте — осознанный риск (LAN-only, bearer).
      DOCKER_SOCKET: /var/run/docker.sock
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - ./data:/data
      # Медиатека (movies/tv и прочие подпапки) на 1ТБ-диске. На hermes.lan это /srv/stack/media;
      # переопределяется MEDIA_HOST_PATH в .env. rw — нужен для qB savePath registry/файл-браузера.
      - ${MEDIA_HOST_PATH:-/srv/stack/media}:/media:rw
      # Docker-интеграция (rw для start/stop/restart):
      - /var/run/docker.sock:/var/run/docker.sock:rw
    # Hermes Agent API крутится на хосте (hermes.lan) — открываем доступ к нему
    # из контейнера. В .env задать HERMES_URL=http://host.docker.internal:8642.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Подключаемся к сети homelab-стека (Jellyfin/Jackett/qBittorrent/TorrServer),
    # чтобы ходить к ним напрямую по имени контейнера, а не только через
    # host.docker.internal. Внешняя сеть создаётся homelab-compose (имя проекта stack).
    networks:
      - default
      - homelab
    restart: unless-stopped

  frontend:
    image: ghcr.io/braidner/braidnerassist-frontend:${IMAGE_TAG:-latest}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  homelab:
    external: true
    name: stack_stack
