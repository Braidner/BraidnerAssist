<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Mission Control">
  <defs>
    <radialGradient id="background" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#151923"/>
      <stop offset="1" stop-color="#080a0f"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feFlood flood-color="#e53333" flood-opacity=".42"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#background)"/>
  <rect
    x="64"
    y="64"
    width="384"
    height="384"
    rx="104"
    fill="#11151f"
    stroke="#e53333"
    stroke-opacity=".72"
    stroke-width="7"
    filter="url(#glow)"
  />
  <g fill="none" stroke="#ff3434" stroke-width="18" filter="url(#glow)">
    <circle cx="256" cy="256" r="108"/>
    <circle cx="256" cy="256" r="65"/>
    <circle cx="256" cy="256" r="22"/>
  </g>
</svg>
